<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gothic Nocturne — a 32-bit side-scrolling action platformer</title>
<meta name="description" content="Gothic Nocturne: a whip-cracking 32-bit era side-scrolling action platformer with multi-layer parallax backgrounds, set on the midnight road to a haunted castle.">
<style>
  :root {
    color-scheme: dark;
    --vv-h: 100dvh;
    --vv-top: 0px;
  }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: #07060c;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #safe-probe {
    position: fixed;
    inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    pointer-events: none;
    visibility: hidden;
  }
  #stage-wrap {
    position: relative;
    line-height: 0;
    flex: 0 0 auto;
    contain: layout paint;
  }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    outline: none;
    box-shadow: 0 0 0 1px #1b1a2a;
  }
  @media (hover: hover) and (pointer: fine) {
    #game { cursor: none; }
  }
  #game:focus-visible { box-shadow: 0 0 0 2px #8a9ab5; }
  #boot {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a9ab5;
    letter-spacing: .3em;
    font-size: 12px;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity .4s;
    z-index: 30;
  }
  #boot.hidden { opacity: 0; }

  /* Hidden proxy input so iOS Safari & Android IME open software keyboards for Forge & Callsign */
  #mobile-text-proxy {
    position: fixed;
    left: 50%;
    top: 8px;
    width: 1px;
    height: 1px;
    opacity: 0.01;
    font-size: 16px;
    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    pointer-events: none;
    z-index: -1;
  }

  /* ----------------------- Mobile Touch Controller Deck ----------------------- */
  body.touch-active {
    height: var(--vv-h, 100dvh);
    box-sizing: border-box;
  }

  /* Portrait: 16:9 stage sits cleanly at top; full gothic arcade controller deck below */
  body.touch-active[data-orient="portrait"] {
    flex-direction: column;
    justify-content: flex-start;
    padding-top: env(safe-area-inset-top, 0px);
  }
  body.touch-active[data-orient="portrait"] #stage-wrap {
    border-bottom: 1px solid #3a2e22;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .82);
  }
  body.touch-active[data-orient="portrait"] #touch-ui {
    flex: 1 1 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 8px max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    box-sizing: border-box;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(44, 26, 62, 0.42), rgba(7, 6, 12, 0.98) 72%),
      linear-gradient(180deg, #0d0a16 0%, #07060c 100%);
    z-index: 20;
  }
  body.touch-active.in-text-form[data-orient="portrait"] #touch-ui {
    justify-content: flex-start;
    gap: 10px;
  }
  body.touch-active[data-orient="portrait"] #touch-pads {
    flex: 1 1 auto;
    width: 100%;
    max-width: 540px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px 6px;
    box-sizing: border-box;
  }

  /* Landscape: full-height widescreen stage with low-profile safe-area overlays */
  body.touch-active[data-orient="landscape"] {
    flex-direction: column;
    justify-content: center;
  }
  body.touch-active.has-bottom-strip[data-orient="landscape"],
  body.touch-active.keyboard-open[data-orient="landscape"] {
    justify-content: flex-start;
    padding-top: max(2px, env(safe-area-inset-top, 2px));
  }
  body.touch-active[data-orient="landscape"] #touch-ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }
  body.touch-active[data-orient="landscape"] #touch-bar {
    position: absolute;
    bottom: max(5px, env(safe-area-inset-bottom, 5px));
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
    opacity: 0.78;
  }
  body.touch-active.in-text-form[data-orient="landscape"] #touch-bar {
    top: max(4px, env(safe-area-inset-top, 4px));
    right: max(8px, env(safe-area-inset-right, 8px));
    left: auto;
    bottom: auto;
    transform: none;
  }
  body.touch-active[data-orient="landscape"] #touch-prompt {
    position: absolute;
    bottom: calc(max(5px, env(safe-area-inset-bottom, 5px)) + 32px);
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
  }
  body.touch-active[data-orient="landscape"] #touch-kbd-bar {
    position: absolute;
    bottom: max(5px, env(safe-area-inset-bottom, 5px));
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
  }
  body.touch-active[data-orient="landscape"] #touch-dpad {
    position: absolute;
    left: max(12px, env(safe-area-inset-left, 12px));
    bottom: max(10px, env(safe-area-inset-bottom, 10px));
    width: clamp(118px, 32vh, 144px);
    height: clamp(118px, 32vh, 144px);
    pointer-events: auto;
    opacity: 0.76;
    transform-origin: bottom left;
    transition: opacity 90ms, transform 90ms;
  }
  body.touch-active[data-orient="landscape"] #touch-actions {
    position: absolute;
    right: max(12px, env(safe-area-inset-right, 12px));
    bottom: max(10px, env(safe-area-inset-bottom, 10px));
    width: clamp(136px, 38vh, 168px);
    height: clamp(122px, 34vh, 152px);
    pointer-events: auto;
    opacity: 0.80;
    transform-origin: bottom right;
    transition: opacity 90ms, transform 90ms;
  }
  body.touch-active.menu-pads[data-orient="landscape"] #touch-dpad:not(.is-active),
  body.touch-active.menu-pads[data-orient="landscape"] #touch-actions:not(.is-active) {
    opacity: 0.38;
    transform: scale(0.84);
  }
  #touch-actions.is-active {
    opacity: 0.98 !important;
  }

  /* Toolbar & keyboard action strips */
  #touch-bar, #touch-kbd-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 5px;
    max-width: 100%;
  }
  body.touch-active[data-orient="portrait"] #touch-kbd-bar {
    margin-top: 4px;
  }
  .t-pill {
    appearance: none;
    border: 1px solid #4d3f30;
    background: rgba(10, 8, 20, 0.88);
    color: #c9c3b0;
    font: 700 10px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.08em;
    padding: 7px 9px;
    min-height: 28px;
    border-radius: 4px;
    box-shadow: inset 0 1px 0 rgba(255, 224, 160, 0.12), 0 2px 6px rgba(0, 0, 0, 0.6);
    touch-action: none;
    cursor: pointer;
    white-space: nowrap;
  }
  body.touch-active[data-orient="landscape"] .t-pill {
    padding: 5px 8px;
    min-height: 24px;
    font-size: 9.5px;
  }
  .t-pill:active, .t-pill.is-on {
    border-color: #ffd27a;
    color: #ffd27a;
    background: rgba(34, 24, 42, 0.94);
  }
  .t-pill.t-pill-gold {
    border-color: #a88242;
    color: #ffd27a;
    background: rgba(28, 20, 14, 0.92);
  }
  .t-pill.is-dim {
    opacity: 0.52;
  }

  /* Contextual doorway / sanctuary / stone-break prompt pill */
  #touch-prompt {
    appearance: none;
    border: 1px solid #ffd27a;
    background: rgba(14, 10, 26, 0.92);
    color: #ffd27a;
    font: 700 10.5px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.1em;
    padding: 7px 14px;
    border-radius: 999px;
    box-shadow: 0 0 14px rgba(255, 210, 122, 0.25), 0 2px 8px rgba(0, 0, 0, 0.7);
    touch-action: none;
    cursor: pointer;
    white-space: nowrap;
  }
  #touch-prompt:active {
    background: rgba(48, 34, 22, 0.96);
    transform: scale(0.97);
  }

  /* 8-Way Gothic D-Pad */
  #touch-dpad {
    position: relative;
    width: clamp(130px, 38vw, 156px);
    height: clamp(130px, 38vw, 156px);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  #touch-dpad.is-active {
    opacity: 0.98 !important;
  }
  .dpad-ring {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(28, 24, 46, 0.82), rgba(9, 7, 18, 0.92) 72%);
    border: 1.5px solid rgba(138, 106, 58, 0.72);
    box-shadow:
      inset 0 0 0 2px rgba(58, 46, 76, 0.45),
      0 4px 18px rgba(0, 0, 0, 0.68);
  }
  /* Subtle crosshairetched guides */
  .dpad-ring::before, .dpad-ring::after {
    content: "";
    position: absolute;
    background: rgba(138, 154, 181, 0.14);
    pointer-events: none;
  }
  .dpad-ring::before { left: 16%; right: 16%; top: 50%; height: 1px; transform: translateY(-0.5px); }
  .dpad-ring::after  { top: 16%; bottom: 16%; left: 50%; width: 1px; transform: translateX(-0.5px); }

  .dpad-arm {
    position: absolute;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9aa8c4;
    font-size: 14px;
    border-radius: 6px;
    pointer-events: none;
    transition: color 60ms, background 60ms, box-shadow 60ms;
  }
  .dpad-up    { top: 5px; left: 50%; transform: translateX(-50%); }
  .dpad-down  { bottom: 5px; left: 50%; transform: translateX(-50%); }
  .dpad-left  { left: 5px; top: 50%; transform: translateY(-50%); }
  .dpad-right { right: 5px; top: 50%; transform: translateY(-50%); }
  .dpad-arm.is-down {
    color: #ffd27a;
    background: rgba(255, 210, 122, 0.18);
    box-shadow: 0 0 10px rgba(255, 210, 122, 0.35);
  }
  .dpad-arm.is-hint {
    color: #62f2c2;
    box-shadow: 0 0 12px rgba(98, 242, 194, 0.55);
  }
  .dpad-hub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #3a314e, #161226);
    border: 1px solid #8a6a3a;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    pointer-events: none;
  }
  #touch-dpad.is-active .dpad-hub {
    border-color: #ffd27a;
    background: radial-gradient(circle at 40% 35%, #5c4832, #241a2e);
  }

  /* Right Action Cluster (L-HAND, R-HAND, JUMP, SUB) */
  #touch-actions {
    position: relative;
    width: clamp(154px, 44vw, 184px);
    height: clamp(142px, 40vw, 168px);
    touch-action: none;
  }
  .act-btn {
    position: absolute;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    pointer-events: none;
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, 0.16),
      0 4px 14px rgba(0, 0, 0, 0.72);
    transition: transform 50ms, border-color 50ms, background 50ms;
  }
  .act-label {
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-shadow: 0 1px 2px #05040a;
  }
  .act-sub-meta {
    font-size: 8.5px;
    letter-spacing: 0.04em;
    color: #9eb0d0;
    margin-top: 2px;
  }
  /* WHIP: bottom-left of right thumb arc, crimson & brass */
  .act-whip {
    left: 0;
    bottom: 6px;
    width: clamp(64px, 18vw, 74px);
    height: clamp(64px, 18vw, 74px);
    background: radial-gradient(circle at 42% 35%, rgba(126, 28, 44, 0.88), rgba(34, 10, 20, 0.94));
    border: 1.5px solid #c23b4a;
    color: #ffe4e0;
  }
  .act-whip.is-down {
    transform: scale(0.93);
    border-color: #ffd27a;
    background: radial-gradient(circle at 42% 35%, rgba(196, 56, 74, 0.95), rgba(74, 18, 32, 0.98));
    box-shadow: 0 0 16px rgba(226, 60, 76, 0.55);
  }
  /* JUMP: right & slightly higher along natural thumb sweep, moonlight & gold */
  .act-jump {
    right: 0;
    bottom: 24px;
    width: clamp(64px, 18vw, 74px);
    height: clamp(64px, 18vw, 74px);
    background: radial-gradient(circle at 42% 35%, rgba(48, 60, 96, 0.88), rgba(14, 16, 32, 0.94));
    border: 1.5px solid #8a9ab5;
    color: #f4efe0;
  }
  .act-jump.is-down {
    transform: scale(0.93);
    border-color: #ffd27a;
    background: radial-gradient(circle at 42% 35%, rgba(86, 108, 164, 0.95), rgba(28, 34, 66, 0.98));
    box-shadow: 0 0 16px rgba(255, 210, 122, 0.45);
  }
  /* SUB: tucked above L-HAND for instant 1-tap sub-weapon throws (↑+Attack) */
  .act-sub {
    left: 10px;
    top: 2px;
    width: clamp(48px, 13.5vw, 54px);
    height: clamp(48px, 13.5vw, 54px);
    background: radial-gradient(circle at 42% 35%, rgba(28, 52, 56, 0.86), rgba(10, 16, 24, 0.92));
    border: 1.5px solid #5b6b86;
    color: #d8e6f2;
  }
  .act-sub .act-label { font-size: 9.5px; }
  .act-sub.is-armed {
    border-color: #62f2c2;
    color: #ffd27a;
  }
  .act-sub.is-armed .act-sub-meta { color: #9ef5dc; }
  .act-sub.is-empty { opacity: 0.48; }
  .act-sub.is-down {
    transform: scale(0.92);
    border-color: #ffd27a;
    opacity: 1;
    background: radial-gradient(circle at 42% 35%, rgba(44, 110, 102, 0.95), rgba(18, 36, 42, 0.98));
  }
  /* OFF-HAND (`Hand_R`): top-right socket of right thumb arc, amethyst & gold */
  .act-offhand {
    right: 10px;
    top: 0;
    width: clamp(52px, 14.5vw, 58px);
    height: clamp(52px, 14.5vw, 58px);
    background: radial-gradient(circle at 42% 35%, rgba(82, 42, 128, 0.88), rgba(22, 12, 40, 0.94));
    border: 1.5px solid #a87cff;
    color: #f4eaff;
  }
  .act-offhand .act-label { font-size: 9px; }
  .act-offhand.is-down {
    transform: scale(0.92);
    border-color: #ffd27a;
    background: radial-gradient(circle at 42% 35%, rgba(138, 76, 206, 0.96), rgba(46, 22, 82, 0.98));
    box-shadow: 0 0 16px rgba(184, 132, 255, 0.55);
  }

  /* Landscape button sizing overrides based on viewport height */
  body.touch-active[data-orient="landscape"] .act-whip {
    width: clamp(58px, 16vh, 68px);
    height: clamp(58px, 16vh, 68px);
    bottom: 4px;
  }
  body.touch-active[data-orient="landscape"] .act-jump {
    width: clamp(58px, 16vh, 68px);
    height: clamp(58px, 16vh, 68px);
    bottom: 16px;
  }
  body.touch-active[data-orient="landscape"] .act-sub {
    width: clamp(44px, 12.5vh, 50px);
    height: clamp(44px, 12.5vh, 50px);
    left: 8px;
  }
  body.touch-active[data-orient="landscape"] .act-offhand {
    width: clamp(48px, 13.5vh, 54px);
    height: clamp(48px, 13.5vh, 54px);
    right: 8px;
  }
</style>
</head>
<body>
  <div id="safe-probe" aria-hidden="true"></div>
  <main id="stage-wrap">
    <h1 hidden>Gothic Nocturne</h1>
    <canvas id="game" width="640" height="360" tabindex="0" aria-label="Gothic Nocturne game canvas"></canvas>
  </main>
  <div id="touch-ui" aria-label="Touch game controls" hidden>
    <div id="touch-bar" role="toolbar" aria-label="Game actions">
      <button type="button" class="t-pill" data-act="pause">START</button>
      <button type="button" class="t-pill" data-act="armory" hidden>GEAR</button>
      <button type="button" class="t-pill" data-act="map" hidden>MAP</button>
      <button type="button" class="t-pill" data-act="context">FORGE</button>
      <button type="button" class="t-pill" data-act="callsign">NAME</button>
      <button type="button" class="t-pill" data-act="mute">SOUND</button>
      <button type="button" class="t-pill" data-act="fx">FX ON</button>
      <button type="button" class="t-pill" data-act="fullscreen" hidden>FULL</button>
    </div>
    <button type="button" id="touch-prompt" hidden></button>
    <div id="touch-kbd-bar" hidden>
      <button type="button" class="t-pill t-pill-gold" data-kbd="type">⌨ TYPE</button>
      <button type="button" class="t-pill" data-kbd="surprise">SURPRISE ME</button>
      <button type="button" class="t-pill" data-kbd="field">DESC ▾</button>
      <button type="button" class="t-pill t-pill-gold" data-kbd="done">CONFIRM</button>
      <button type="button" class="t-pill" data-kbd="cancel">CANCEL</button>
    </div>
    <div id="touch-pads">
      <div id="touch-dpad" aria-label="Directional pad">
        <div class="dpad-ring">
          <span class="dpad-arm dpad-up" data-dir="up">▲</span>
          <span class="dpad-arm dpad-down" data-dir="down">▼</span>
          <span class="dpad-arm dpad-left" data-dir="left">◀</span>
          <span class="dpad-arm dpad-right" data-dir="right">▶</span>
          <span class="dpad-hub" id="dpad-nub"></span>
        </div>
      </div>
      <div id="touch-actions" aria-label="Action buttons">
        <div class="act-btn act-sub" data-btn="sub" role="button" aria-label="Sub-Weapon or Back">
          <span class="act-label" id="sub-label">SUB</span>
          <span class="act-sub-meta" id="sub-meta">NONE</span>
        </div>
        <div class="act-btn act-offhand" data-btn="offhand" role="button" aria-label="Right Hand Weapon" hidden>
          <span class="act-label" id="offhand-label">R-HAND</span>
          <span class="act-sub-meta" id="offhand-meta">R</span>
        </div>
        <div class="act-btn act-whip" data-btn="whip" role="button" aria-label="Left Hand Weapon">
          <span class="act-label" id="whip-label">WHIP</span>
        </div>
        <div class="act-btn act-jump" data-btn="jump" role="button" aria-label="Jump">
          <span class="act-label" id="jump-label">JUMP</span>
        </div>
      </div>
    </div>
  </div>
  <input id="mobile-text-proxy" data-mobile-proxy="1" type="text" inputmode="text"
    autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"
    enterkeyhint="done" aria-label="Text entry" tabindex="-1">
  <div id="boot" role="status">Loading the castle…</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
